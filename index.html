<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kwa Irene, kutoka kwa Wilbard 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Poppins','Segoe UI',sans-serif;background:radial-gradient(ellipse at 30% 20%,#4a0d3a 0%,#1c0618 45%,#08020a 100%);color:#ffe5ec;min-height:100vh;overflow-x:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:#ff4d6d;top:-80px;left:-80px}
.o2{width:360px;height:360px;background:#8338ec;bottom:-120px;right:-100px;animation-delay:-5s}
.o3{width:220px;height:220px;background:#ff9e00;top:45%;left:60%;opacity:.25;animation-delay:-9s}
@keyframes drift{to{transform:translate(60px,-40px) scale(1.2)}}
.star{position:fixed;background:#fff;border-radius:50%;z-index:0;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.9}}

/* INTRO */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(ellipse at center,#3d0a30 0%,#12040f 100%);transition:opacity 1s ease,visibility 1s}
#intro.hide{opacity:0;visibility:hidden}
.big-heart{font-size:90px;animation:beat 1.2s ease-in-out infinite;filter:drop-shadow(0 0 25px #ff4d6d)}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
#intro h2{font-family:'Dancing Script',cursive;font-size:44px;margin:10px 0 4px;background:linear-gradient(90deg,#ff9ec4,#fff,#ff9ec4);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:shimmer 3s linear infinite}
#intro p{font-weight:300;max-width:320px;line-height:1.7;margin:6px 0 28px;color:#ffc2d4}
@keyframes shimmer{to{background-position:200% 0}}
.open-btn{background:linear-gradient(45deg,#ff4d6d,#c9184a);color:#fff;border:none;padding:16px 38px;border-radius:50px;font:500 17px 'Poppins',sans-serif;cursor:pointer;box-shadow:0 0 0 0 rgba(255,77,109,.7);animation:ring 1.8s infinite}
@keyframes ring{70%{box-shadow:0 0 0 22px rgba(255,77,109,0)}100%{box-shadow:0 0 0 0 rgba(255,77,109,0)}}

/* MAIN */
#stage{position:relative;z-index:5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 12px;opacity:0;transition:opacity 1.2s ease .3s}
#stage.show{opacity:1}
.card{position:relative;width:100%;max-width:580px;padding:26px 24px 30px;border-radius:32px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.18);box-shadow:0 0 50px rgba(255,77,109,.2),0 30px 70px rgba(0,0,0,.6);transform:translateY(40px) scale(.95);transition:transform 1.1s cubic-bezier(.2,.9,.3,1.2)}
#stage.show .card{transform:none}
.card::before{content:"";position:absolute;inset:-2px;border-radius:34px;z-index:-1;background:conic-gradient(from 0deg,#ff4d6d,#8338ec,#ff9e00,#ff4d6d);filter:blur(14px);opacity:.45;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:'Dancing Script',cursive;font-size:34px;line-height:1.25;margin:0 0 6px;font-weight:700;background:linear-gradient(90deg,#ff9ec4,#ffffff,#c9a7ff,#ff9ec4);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
.sub{font-size:13px;letter-spacing:3px;color:#ffb3c8;text-transform:uppercase;margin-bottom:6px}

.scene-wrap{border-radius:22px;overflow:hidden;margin:10px 0 14px;background:linear-gradient(180deg,#2a0b2e 0%,#5a1240 60%,#7a1a4a 100%);border:1px solid rgba(255,255,255,.1)}
.scene{display:block;width:100%;height:auto}
.fl{animation:flo 3s ease-in-out infinite}.fl2{animation:flo 4s ease-in-out infinite -1s}.fl3{animation:flo 3.5s ease-in-out infinite -2s}
@keyframes flo{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-10px);opacity:1}}
.man{animation:plead 3s ease-in-out infinite;transform-origin:130px 200px}
@keyframes plead{0%,100%{transform:rotate(0)}50%{transform:rotate(1.8deg)}}
.arm-offer{animation:offer 3s ease-in-out infinite;transform-origin:150px 110px}
@keyframes offer{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}

.message-container{margin:6px 0 20px;padding:18px 18px;background:rgba(10,0,10,.5);border-radius:20px;border-left:4px solid #ff4d6d;text-align:left;max-height:36vh;min-height:170px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#ff4d6d transparent}
.message-box{font-size:15px;line-height:1.85;font-weight:300;color:#ffeaf1}
.cursor{display:inline-block;width:2px;height:16px;background:#ff4d6d;margin-left:2px;vertical-align:middle;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.btn-love{background:linear-gradient(45deg,#ff4d6d,#c9184a);color:#fff;border:none;padding:15px 28px;font:500 16px 'Poppins',sans-serif;border-radius:50px;cursor:pointer;box-shadow:0 8px 25px rgba(255,77,109,.4);opacity:0;pointer-events:none;transition:transform .3s}
.btn-love.show{opacity:1;pointer-events:auto;animation:bounceIn .7s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.btn-love:hover{transform:scale(1.05)}
.voice-bar{display:flex;justify-content:center;gap:10px;margin:-6px 0 14px;flex-wrap:wrap}
.vbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#ffd6e3;border-radius:30px;padding:8px 16px;font:400 13px 'Poppins',sans-serif;cursor:pointer}
.vbtn:hover{background:rgba(255,77,109,.3)}
.wave{display:inline-flex;gap:3px;align-items:center;height:16px;margin-right:6px;vertical-align:middle}
.wave i{display:block;width:3px;height:6px;background:#ff758f;border-radius:2px;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{50%{height:16px}}
.speaking .wave{opacity:1}.wave{opacity:.25}
.fall{position:fixed;pointer-events:none;z-index:3;top:-30px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(108vh) translateX(80px) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div id="stars"></div>

<div id="intro">
  <div class="big-heart">💌</div>
  <h2>Irene, mpenzi wangu...</h2>
  <p>Kuna kitu cha moyoni nimekuandalia wewe peke yako. Tafadhali kifungue.</p>
  <button class="open-btn" onclick="openLetter()">Fungua barua yangu 💖</button>
</div>

<div id="stage">
<div class="card" id="mainCard">
  <div class="sub">Kwa moyo wa dhati</div>
  <h1 id="mainTitle">Irene my love, naomba unisamehe 💞</h1>

  <div class="scene-wrap">
  <svg class="scene" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mwanaume amepiga magoti akimuomba msamaha mwanamke aliyesimama">
    <defs>
      <radialGradient id="spot" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd6e6" stop-opacity=".55"/><stop offset="1" stop-color="#ffd6e6" stop-opacity="0"/></radialGradient>
      <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#a4133c"/></linearGradient>
    </defs>
    <!-- moon & stars -->
    <circle cx="340" cy="38" r="20" fill="#fff6d6"/><circle cx="332" cy="32" r="18" fill="#2a0b2e"/>
    <g fill="#fff"><circle cx="40" cy="30" r="1.5"/><circle cx="110" cy="50" r="1.2"/><circle cx="210" cy="24" r="1.6"/><circle cx="270" cy="60" r="1.2"/><circle cx="60" cy="90" r="1.1"/></g>
    <!-- ground & spotlight -->
    <ellipse cx="200" cy="236" rx="190" ry="18" fill="url(#spot)"/>
    <rect x="0" y="232" width="400" height="28" fill="#3a0f35"/>
    <!-- rose petals on ground -->
    <g fill="#ff4d6d" opacity=".85"><ellipse cx="205" cy="240" rx="5" ry="2.5" transform="rotate(-15 205 240)"/><ellipse cx="225" cy="246" rx="5" ry="2.5" transform="rotate(10 225 246)"/><ellipse cx="250" cy="242" rx="5" ry="2.5"/><ellipse cx="185" cy="248" rx="5" ry="2.5" transform="rotate(20 185 248)"/></g>

    <!-- WOMAN standing (facing left) -->
    <g>
      <!-- hair back -->
      <path d="M296 56 Q282 60 284 110 Q286 135 296 140 L330 140 Q340 120 336 84 Q334 50 312 44 Z" fill="#1a0a14"/>
      <!-- legs -->
      <rect x="302" y="200" width="9" height="30" fill="#9a6544"/><rect x="316" y="200" width="9" height="30" fill="#9a6544"/>
      <ellipse cx="305" cy="232" rx="8" ry="3.5" fill="#2a0b2e"/><ellipse cx="320" cy="232" rx="8" ry="3.5" fill="#2a0b2e"/>
      <!-- dress -->
      <path d="M303 92 L325 92 L330 130 L352 210 Q313 222 276 210 L298 130 Z" fill="url(#dress)"/>
      <path d="M298 130 L330 130" stroke="#7a0f30" stroke-width="3"/>
      <!-- neck/head -->
      <rect x="309" y="78" width="9" height="14" fill="#9a6544"/>
      <circle cx="313" cy="64" r="17" fill="#9a6544"/>
      <path d="M296 62 Q298 42 314 42 Q332 44 330 66 Q324 52 312 52 Q302 54 296 62Z" fill="#1a0a14"/>
      <circle cx="307" cy="66" r="1.6" fill="#2a0b2e"/>
      <path d="M303 74 Q308 78 313 74" stroke="#7a2a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- blush -->
      <circle cx="302" cy="72" r="3.5" fill="#ff7a9a" opacity=".5"/>
      <!-- arms: hands clasped near chest -->
      <path d="M305 96 Q290 112 298 124" stroke="#9a6544" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M323 96 Q332 112 316 124" stroke="#9a6544" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="306" cy="125" r="6" fill="#9a6544"/>
    </g>

    <!-- MAN kneeling on one knee (facing right) -->
    <g class="man">
      <!-- back leg -->
      <path d="M128 176 L132 224" stroke="#1d2f6f" stroke-width="22" stroke-linecap="round"/>
      <path d="M132 224 L72 226" stroke="#1d2f6f" stroke-width="17" stroke-linecap="round"/>
      <ellipse cx="64" cy="224" rx="10" ry="6" fill="#111"/>
      <!-- front leg -->
      <path d="M128 176 L180 178" stroke="#274690" stroke-width="24" stroke-linecap="round"/>
      <path d="M180 178 L184 222" stroke="#274690" stroke-width="19" stroke-linecap="round"/>
      <ellipse cx="194" cy="228" rx="16" ry="6.5" fill="#111"/>
      <!-- torso -->
      <path d="M128 176 L130 112" stroke="#f2f2f7" stroke-width="34" stroke-linecap="round"/>
      <path d="M118 150 L142 150" stroke="#d6d6e0" stroke-width="2"/>
      <!-- neck/head -->
      <rect x="128" y="84" width="9" height="14" fill="#6b4328"/>
      <circle cx="136" cy="72" r="17" fill="#6b4328"/>
      <path d="M118 70 Q119 50 138 51 Q154 52 154 66 Q146 58 136 59 Q126 58 118 70Z" fill="#150a06"/>
      <circle cx="145" cy="74" r="1.7" fill="#150a06"/>
      <path d="M140 83 Q146 84 150 80" stroke="#4a2a18" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- sad brows -->
      <path d="M141 68 L148 66" stroke="#150a06" stroke-width="1.6" stroke-linecap="round"/>
      <!-- arm resting on front knee -->
      <path d="M126 118 Q150 150 172 168" stroke="#f2f2f7" stroke-width="12" stroke-linecap="round" fill="none"/>
      <circle cx="174" cy="170" r="6" fill="#6b4328"/>
      <!-- offering arm with rose -->
      <g class="arm-offer">
        <path d="M130 112 Q170 100 214 98" stroke="#f2f2f7" stroke-width="12" stroke-linecap="round" fill="none"/>
        <circle cx="218" cy="98" r="6.5" fill="#6b4328"/>
        <path d="M220 98 L238 66" stroke="#2a9d3a" stroke-width="3" stroke-linecap="round"/>
        <path d="M229 82 q8 -2 10 4 q-8 3 -10 -4z" fill="#2a9d3a"/>
        <circle cx="240" cy="60" r="11" fill="#e5173f"/>
        <path d="M233 58 Q240 50 247 58 Q240 66 233 58Z" fill="#9b0d28"/>
        <circle cx="240" cy="60" r="4" fill="#ff5a78"/>
      </g>
    </g>

    <!-- floating hearts -->
    <text class="fl" x="205" y="40" font-size="22">💖</text>
    <text class="fl2" x="255" y="30" font-size="16">💗</text>
    <text class="fl3" x="170" y="22" font-size="14">✨</text>
  </svg>
  </div>

  <div class="voice-bar" id="voiceBar">
    <button class="vbtn" id="muteBtn" onclick="toggleVoice()"><span class="wave"><i></i><i></i><i></i><i></i></span><span id="muteLbl">Sauti: Imewashwa 🔊</span></button>
    <button class="vbtn" id="replayBtn" onclick="replay()" style="display:none">🔁 Sikiliza tena</button>
  </div>
  <div class="message-container" id="msgWrap"><span class="message-box" id="msgBox"></span><span class="cursor" id="cursor"></span></div>

  <button class="btn-love" id="actionBtn" onclick="acceptApology()">Bonyeza hapa kama umenisamehe, Wilbard wako 🌹</button>
</div>
</div>

<script>
const textToType = "Irene mpenzi wangu, malkia wa moyo wangu...\n\nNimepiga magoti mbele yako, moyo wangu ukiwa mzito kuliko wakati wowote. Nilikutukana, na hakuna sababu yoyote, iwe hasira, uchovu au msongo wa mawazo, inayoweza kuhalalisha maneno yale. Wewe ni mwanamke ninayepaswa kukuheshimu, kukulinda na kukupenda, si kukuumiza. Nimekosea, na nakiri kosa langu kwa moyo wote bila visingizio.\n\nNajua maneno yangu yaliumiza moyo wako. Kila ninapofikiria maumivu uliyoyapata kwa sababu yangu, moyo wangu unavunjika vipande vipande. Samahani sana, Irene wangu. Samahani kwa maneno yale, samahani kwa machozi na kwa amani niliyokuvunjia.\n\nWewe ni zawadi ambayo Mungu alinipa, mtu mwenye upendo, uvumilivu na moyo mwema. Hustahili kamwe kusikia neno baya kutoka kwa mwanaume anayekupenda. Nakuahidi kuwa nitajifunza kudhibiti hasira na ulimi wangu, na hata tutakapokosana nitaongea nawe kwa upole na heshima.\n\nSikulazimishi unisamehe leo. Chukua muda wako, kwa sababu nastahili kusubiri. Lakini kama moyo wako utaniruhusu, naomba nafasi nyingine ya kukuonyesha mwanaume ninayetaka kuwa kwako. Nakupenda sana, Irene wangu. ❤️🌹";

const msgBox=document.getElementById('msgBox'), msgWrap=document.getElementById('msgWrap');
const actionBtn=document.getElementById('actionBtn'), cursor=document.getElementById('cursor');
const card=document.getElementById('mainCard');

// background stars
(function(){const s=document.getElementById('stars');for(let i=0;i<40;i++){const d=document.createElement('div');d.className='star';const z=Math.random()*2+1;d.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}vw;top:${Math.random()*100}vh;animation-delay:${Math.random()*3}s`;s.appendChild(d);}})();

// ---- sentence segments ----
const segments=[];
textToType.split('\n\n').forEach(par=>{
  const parts=par.match(/[^.!?]+(?:\.\.\.|[.!?])*\s*/g)||[par];
  parts.forEach((t,i)=>segments.push({text:t.trim(),brk:i===parts.length-1}));
});

// SPEECH ENGINE (FORCE MALE VOICE SOUND)
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voiceOn = true, session = 0, selectedVoice = null;

function loadVoices(){
  if(!synth) return;
  const voices = synth.getVoices();
  // Tafuta sauti yoyote ya kiume au ya Kiswahili
  selectedVoice = voices.find(v => /male|man|david|george|stefan|sw-tz-male|swahili/i.test(v.name) || /male/i.test(v.voiceURI)) 
               || voices.find(v => /^sw/i.test(v.lang)) 
               || voices[0];
}

if(synth){
  loadVoices();
  synth.onvoiceschanged = loadVoices;
}

function cleanText(t){ return t.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu,'').trim(); }

function speak(text){
  return new Promise(resolve => {
    const txt = cleanText(text);
    if(!voiceOn || !synth || !txt){ resolve(); return; }
    
    synth.cancel(); // Un-stuck any audio queue
    
    const utt = new SpeechSynthesisUtterance(txt);
    if(selectedVoice) utt.voice = selectedVoice;
    utt.lang = 'sw-TZ';
    
    // BADILISHA PARAMETERS KUWA YA KIUME NZITO (DEEP BASS)
    utt.pitch = 0.35; // Inashusha pitch mara 3 chini kupata sauti nzito ya kiume
    utt.rate = 0.72;  // Inapunguza kasi kidogo ili kutoa sauti ya kiume iliyostulia
    utt.volume = 1;

    let completed = false;
    const endHandler = () => {
      if(!completed){
        completed = true;
        clearTimeout(safetyTimer);
        card.classList.remove('speaking');
        resolve();
      }
    };

    // Safetimer ikiwa browser itaganda
    const safetyTimer = setTimeout(endHandler, txt.length * 180 + 3000);

    utt.onstart = () => card.classList.add('speaking');
    utt.onend = endHandler;
    utt.onerror = endHandler;

    synth.speak(utt);
  });
}

function typeText(str, per, mySession){
  return new Promise(resolve => {
    let i = 0;
    (function step(){
      if(mySession !== session || i >= str.length){ resolve(); return; }
      const ch = str.charAt(i++);
      msgBox.innerHTML += (ch === '\n') ? '<br>' : ch;
      msgWrap.scrollTop = msgWrap.scrollHeight;
      setTimeout(step, per);
    })();
  });
}

async function tell(){
  const mySession = ++session;
  msgBox.innerHTML = ''; 
  cursor.style.display = 'inline-block';
  actionBtn.classList.remove('show');
  document.getElementById('replayBtn').style.display = 'none';

  for(const seg of segments){
    if(mySession !== session) return;
    const charDelay = voiceOn ? 55 : 22;
    await Promise.all([
      speak(seg.text),
      typeText(seg.text + (seg.brk ? '\n\n' : ' '), charDelay, mySession)
    ]);
    await new Promise(r => setTimeout(r, voiceOn ? 250 : 0));
  }
  if(mySession !== session) return;
  cursor.style.display = 'none';
  actionBtn.classList.add('show');
  if(synth) document.getElementById('replayBtn').style.display = 'inline-block';
}

function toggleVoice(){
  voiceOn = !voiceOn;
  document.getElementById('muteLbl').textContent = voiceOn ? 'Sauti: Imewashwa 🔊' : 'Sauti: Imezimwa 🔇';
  if(!voiceOn && synth){
    synth.cancel();
    card.classList.remove('speaking');
  }
}

function replay(){
  if(synth) synth.cancel();
  voiceOn = true;
  document.getElementById('muteLbl').textContent = 'Sauti: Imewashwa 🔊';
  tell();
}

// ---- falling effects ----
const items=['🌹','✨','💖','🌸','💎','🌷'];
function drop(list,life,min,range,dur){
  const k=document.createElement('div');
  k.className='fall';
  k.textContent=list[Math.floor(Math.random()*list.length)];
  k.style.left=Math.random()*100+'vw';
  k.style.fontSize=Math.random()*range+min+'px';
  k.style.animationDuration=dur()+'s';
  document.body.appendChild(k);
  setTimeout(()=>k.remove(),life);
}
function startFalling(){setInterval(()=>drop(items,8000,12,20,()=>Math.random()*3+5),350);}

function openLetter(){
  // Amsha Speech Engine kwa kubonyeza kitufe (Bypass Browser AutoPlay restriction)
  if(synth){
    synth.cancel();
    const unlockUtterance = new SpeechSynthesisUtterance('');
    unlockUtterance.volume = 0;
    synth.speak(unlockUtterance);
    loadVoices();
  }
  document.getElementById('intro').classList.add('hide');
  document.getElementById('stage').classList.add('show');
  for(let i=0;i<35;i++)setTimeout(()=>drop(['💖','🌹','✨','💝'],4500,16,26,()=>Math.random()*2+2.5),i*70);
  startFalling();
  setTimeout(tell, 800);
}

function acceptApology(){
  session++;
  if(synth) synth.cancel();
  const title=document.getElementById('mainTitle');
  const btn=document.getElementById('actionBtn');
  cursor.style.display='none';
  const thanks="Umeurudishia moyo wa Wilbard wako amani yote. Asante kwa kunipa nafasi nyingine, na ahadi yangu ni hii: nitakuheshimu, nitakulinda na nitakupa furaha unayostahili kila siku. Nakupenda sana, Irene wangu!";
  title.textContent="Asante kwa kunisamehe, My Queen! 🥰💖";
  msgBox.innerHTML=thanks+" 💑🌹✨";
  document.getElementById('replayBtn').style.display='none';
  btn.textContent="Sasa tuna amani kabisa! ✔️";
  btn.style.background='linear-gradient(45deg,#2a9d8f,#1e352f)';
  btn.style.pointerEvents='none';
  speak(thanks);
  for(let i=0;i<250;i++)setTimeout(()=>drop(['💖','💝','✨','👑','🎉','🌹'],3500,15,30,()=>Math.random()*2+1.5),i*30);
}
</script>
</body>
</html>
